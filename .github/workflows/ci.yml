name: CI

on:
  push:
    branches: [main, ng.v20.nd22]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.22.0', '24.15.0']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests (@angular/compiler)
        run: npm run test:contract

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (includes JSON schema validation)
        run: npm run test:integration

      - name: CLI tests
        run: npm run test:cli

      - name: Build
        run: npm run build

      - name: End to end tests
        run: npm run test:e2e
