name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests (@angular/compiler)
        run: npm run test:contract

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (includes JSON schema validation)
        run: npm run test:integration

      - name: CLI tests
        run: npm run test:cli

      - name: Build
        run: npm run build

      - name: End to end tests
        run: npm run test:e2e
